version: 0.2

env:
  variables:
    STACK_NAME: bozo-bet

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.12
  pre_build:
    commands:
      - cd backend && python -m pip install -q pytest boto3 && python -m pytest -q tests && cd ..
      - cd frontend && npm ci --no-audit --no-fund && cd ..
  build:
    commands:
      # Backend has no third-party deps (boto3 ships with Lambda), so sam deploy can package the source dir directly
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
      - |
        out() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
        BUCKET=$(out SiteBucketName); DIST=$(out DistributionId)
        cat > frontend/public/config.json <<JSON
        {"region":"$AWS_REGION","userPoolId":"$(out UserPoolId)","clientId":"$(out UserPoolClientId)","authDomain":"$(out AuthDomain)"}
        JSON
        cd frontend && npm run build && cd ..
        aws s3 sync frontend/dist "s3://$BUCKET" --delete --exclude index.html --exclude config.json --cache-control "public,max-age=31536000,immutable"
        aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
        aws s3 cp frontend/dist/config.json "s3://$BUCKET/config.json" --cache-control "no-cache"
        aws cloudfront create-invalidation --distribution-id "$DIST" --paths /index.html /config.json > /dev/null
